name: arena-watcher

services:
  arena-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-watcher
    restart: unless-stopped
    labels:
      - "com.dozzle.enable=true"
      - "com.dozzle.group=Bots"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      # Admin web UI (token-gated, set WEBUI_TOKEN in .env). Bind to a
      # trusted network only — the page can display secrets.
      - "8080:8080"
    volumes:
      # read-write so the admin UI can save config changes
      - ./config/appsettings.json:/app/config/appsettings.json:rw
      - ./data:/app/data
